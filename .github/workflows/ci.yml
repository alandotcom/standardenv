name: CI

on:
  pull_request:
  workflow_dispatch:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: "latest"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun run test

      # `typecheck` compiles src/ alongside the tests, so ambient types reachable
      # only from a test import can mask a type error in src/. `build` compiles
      # src/ on its own under tsconfig.build.json, which is what `prepack`
      # publishes, so it is the step that catches those.
      - name: Build
        run: bun run build
